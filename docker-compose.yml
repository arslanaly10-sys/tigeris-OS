# One package for both the offline laptop and the cloud VM (ADR-0003).
# Start: docker compose up --build   →   http://localhost:3000
name: tigeris

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: tigeris_superuser
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tigeris"]
      interval: 3s
      retries: 20

  seed:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "seed"]
    environment: &api-env
      DATABASE_OWNER_URL: postgres://tigeris_owner:tigeris_owner@db:5432/tigeris
      DATABASE_APP_URL: postgres://tigeris_app:tigeris_app@db:5432/tigeris
      SESSION_SECRET: ${SESSION_SECRET:-change-me-demo-only}
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *api-env
      API_PORT: "4000"
    depends_on:
      seed: { condition: service_completed_successfully }

  reasoning:
    build: { context: ., dockerfile: services/reasoning/Dockerfile }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: "http://api:4000" }
    environment:
      API_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on: [api, reasoning]

volumes:
  db-data:
