# One package for both the offline laptop and the cloud VM (ADR-0003).
# Start: docker compose up --build   →   http://localhost:3000
name: tigeris

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: tigeris_superuser
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tigeris"]
      interval: 3s
      retries: 20

  seed:
    image: tigeris-api:${TIGERIS_VERSION:-demo}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "seed"]
    volumes:
      - vault-data:/vault
    environment: &api-env
      DATABASE_OWNER_URL: postgres://tigeris_owner:tigeris_owner@db:5432/tigeris
      DATABASE_APP_URL: postgres://tigeris_app:tigeris_app@db:5432/tigeris
      SESSION_SECRET: ${SESSION_SECRET:-change-me-demo-only}
      VAULT_DIR: /vault
      REASONING_URL: http://reasoning:8000
    depends_on:
      db: { condition: service_healthy }
      reasoning: { condition: service_healthy }

  api:
    image: tigeris-api:${TIGERIS_VERSION:-demo}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *api-env
      API_PORT: "4000"
      REASONING_URL: http://reasoning:8000
      VAULT_DIR: /vault
      # Foreign model keys come only from the deployment environment; leave unset to stay local-only.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - vault-data:/vault
    depends_on:
      seed: { condition: service_completed_successfully }

  reasoning:
    image: tigeris-reasoning:${TIGERIS_VERSION:-demo}
    build: { context: ., dockerfile: services/reasoning/Dockerfile }
    environment:
      LOCAL_MODEL_PATH: /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      EMBED_MODEL_PATH: /models/bge-small-en-v1.5-q8_0.gguf
    volumes:
      - ./data/models:/models:ro   # open-weight model file, imported once (air-gap friendly)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30

  web:
    image: tigeris-web:${TIGERIS_VERSION:-demo}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: "http://api:4000" }
    environment:
      API_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on: [api, reasoning]

volumes:
  db-data:
  vault-data:
