name: CI
on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      DATABASE_OWNER_URL: postgres://tigeris_owner:tigeris_owner@localhost:5432/tigeris
      DATABASE_APP_URL: postgres://tigeris_app:tigeris_app@localhost:5432/tigeris
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Create roles and database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f db/init/00-roles.sql
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Start reasoning service
        run: |
          pip install -r services/reasoning/requirements.txt
          (cd services/reasoning && nohup uvicorn app.main:app --port 8000 &)
          until curl -s localhost:8000/health; do sleep 1; done
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @tigeris/web build

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/reasoning } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
